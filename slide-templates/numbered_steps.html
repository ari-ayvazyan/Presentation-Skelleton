<!-- Slide: Numbered process steps -->
<section style="--module-title: 'MODULE 03';">
  <div class="category-badge"></div>
  <h2>Numbered Process Steps</h2>
  <p class="mb-12">Walk through a workflow as a series of numbered stages.</p>

  <div class="grid-2 mt-8 gap-8">
    <neo-card header="Workflow Title" header-bg="var(--step-bg-1)">
      <div class="text-body-sm space-y-3 font-semibold text-left">
        <div class="flex items-center gap-2">
          <span class="bg-black text-white px-2 py-1 rounded-sm">1</span> First step in the process
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-black text-white px-2 py-1 rounded-sm">2</span> Second step in the process
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-black text-white px-2 py-1 rounded-sm">3</span> Third step in the process
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-black text-white px-2 py-1 rounded-sm">4</span> Fourth step in the process
        </div>
      </div>
    </neo-card>
    <neo-card header="Companion Notes" header-bg="var(--step-bg-2)">
      <p class="text-body-sm mb-0" style="line-height: 1.6; opacity: 0.85;">
        Describe inputs, prerequisites, or context that supports the numbered workflow on the left.
      </p>
    </neo-card>
  </div>
</section>
