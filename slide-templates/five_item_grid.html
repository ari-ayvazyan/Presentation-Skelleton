<!-- Slide: 5-item grid with span-2 footer row -->
<section style="--module-title: 'MODULE 03';">
  <div class="category-badge"></div>
  <h2>Five-Item Grid With Wide Row</h2>
  <div class="grid-2 mt-6" style="gap: 1.25rem; width: 100%;">
    <neo-card header="Item One" header-bg="var(--step-bg-1)">
      <p class="text-body-sm mb-0" style="opacity: 0.8;">
        Brief description of the first item.
      </p>
    </neo-card>
    <neo-card header="Item Two" header-bg="var(--step-bg-2)">
      <p class="text-body-sm mb-0" style="opacity: 0.8;">
        Brief description of the second item.
      </p>
    </neo-card>
    <neo-card header="Item Three" header-bg="var(--step-bg-3)">
      <p class="text-body-sm mb-0" style="opacity: 0.8;">
        Brief description of the third item.
      </p>
    </neo-card>
    <neo-card header="Item Four" header-bg="var(--step-bg-4)">
      <p class="text-body-sm mb-0" style="opacity: 0.8;">
        Brief description of the fourth item.
      </p>
    </neo-card>
    <neo-card header="Wide Summary Row" header-bg="var(--step-bg-1)" style="grid-column: span 2;">
      <p class="text-body-sm mb-0" style="opacity: 0.8;">
        Use a span-2 row to call out a summary, exception, or concluding point.
      </p>
    </neo-card>
  </div>
</section>
