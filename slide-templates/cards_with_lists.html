<!-- Slide: Cards with embedded list (3-column) -->
<section style="--module-title: 'MODULE 03';">
  <div class="category-badge"></div>
  <h2>Cards With Embedded Lists</h2>
  <p class="text-body opacity-80 leading-relaxed mb-0">Each card groups several related items under a single heading.</p>

  <div class="grid mt-8" style="gap: 1.5rem; grid-template-columns: repeat(3, 1fr); align-items: stretch;">

    <div class="neo-card interactive">
      <div class="neo-card-header" style="background-color: var(--step-bg-1);">
        <span class="font-extrabold text-section-title text-black">Category One</span>
        <div class="flex items-center justify-center w-8 h-8 rounded-full border border-black bg-white text-black">

        </div>
      </div>
      <div class="neo-card-body justify-between">
        <ul class="flex flex-col gap-3 text-body-sm list-none p-0">
          <li class="flex items-center gap-3 pb-2 border-b border-black/10 last:border-0">
            <span class="w-1.5 h-1.5 rounded-full bg-black flex-shrink-0"></span>
            <span>List item one</span>
          </li>
          <li class="flex items-center gap-3 pb-2 border-b border-black/10 last:border-0">
            <span class="w-1.5 h-1.5 rounded-full bg-black flex-shrink-0"></span>
