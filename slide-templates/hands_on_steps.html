<!-- Slide: Standalone steps row (arrow icon + label) -->
<section style="--module-title: 'MODULE 03';">
  <div class="category-badge"></div>
  <h2>Hands-On Steps</h2>

  <div class="flex gap-12 mt-4">
    <div class="flex-col" style="width: 100%;">
      <p class="text-body opacity-80 leading-relaxed mb-0">
        Use this layout for exercise briefings: a short prompt at the top and individual tasks aligned in a row.
      </p>
    </div>
  </div>

  <div class="grid mt-8" style="gap: 1.5rem; grid-template-columns: repeat(3, 1fr); align-items: stretch;">
    <!-- Step 1 -->
    <neo-card interactive header-bg="var(--step-bg-1)">
      <div slot="header" class="flex justify-between items-center w-full">
        <span class="font-mono text-section-title font-bold tracking-wider text-black">STEP 01</span>
        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border border-black bg-white text-black text-xs font-bold">1</span>
      </div>
      <p class="text-body-sm opacity-85 leading-relaxed mb-0">
        Description of the first task.
      </p>
    </neo-card>

    <!-- Step 2 -->
    <neo-card interactive header-bg="var(--step-bg-2)">
      <div slot="header" class="flex justify-between items-center w-full">
        <span class="font-mono text-section-title font-bold tracking-wider text-black">STEP 02</span>
        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border border-black bg-white text-black text-xs font-bold">2</span>
      </div>
      <p class="text-body-sm opacity-85 leading-relaxed mb-0">
        Description of the second task.
      </p>
    </neo-card>

    <!-- Step 3 -->
    <neo-card interactive header-bg="var(--step-bg-3)">
      <div slot="header" class="flex justify-between items-center w-full">
        <span class="font-mono text-section-title font-bold tracking-wider text-black">STEP 03</span>
        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border border-black bg-white text-black text-xs font-bold">3</span>
      </div>
      <p class="text-body-sm opacity-85 leading-relaxed mb-0">
        Description of the third task.
      </p>
    </neo-card>
  </div>
</section>
