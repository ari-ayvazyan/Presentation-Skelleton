<!-- Slide: Background-image slide with content cards on top -->
<section data-background-image="/assets/slide_bg.webp" data-background-size="cover" style="--module-title: 'MODULE 03';">
  <div class="category-badge"></div>
  <h2>Slide With Background Image</h2>
  <p class="mb-12">Cards float on top of a full-bleed image set via <code>data-background-image</code>.</p>

  <div class="grid-3 mt-8 gap-8">
    <neo-card header="Card One" header-bg="var(--step-bg-1)">
      <p class="text-body-sm mb-0" style="opacity: 0.85;">
        Short text. Keep cards opaque so they remain readable above any background.
      </p>
    </neo-card>
    <neo-card header="Card Two" header-bg="var(--step-bg-2)">
      <p class="text-body-sm mb-0" style="opacity: 0.85;">
        Short text.
      </p>
    </neo-card>
    <neo-card header="Card Three" header-bg="var(--step-bg-3)">
      <p class="text-body-sm mb-0" style="opacity: 0.85;">
        Short text.
      </p>
    </neo-card>
  </div>
</section>
